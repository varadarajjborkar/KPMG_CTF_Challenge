<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gateway Access</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #ffffff;
      border: 1px solid #b0b0b0;
      padding: 24px 32px;
      width: 280px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.15);
    }
    .login-box h2 {
      font-size: 16px;
      color: #333;
      margin-top: 0;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-top: 12px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #aaa;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 8px;
      background: #4a6a8a;
      color: white;
      border: none;
      cursor: pointer;
    }
    .error {
      color: #a33;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Gateway Access Portal</h2>
    <form id="loginForm">
      <label for="user">Username</label>
      <input type="text" id="user" name="user">
      <label for="pass">Password</label>
      <input type="password" id="pass" name="pass">
      <button type="submit">Log In</button>
      <div class="error" id="errorMsg">Invalid username or password.</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('errorMsg').style.display = 'block';
    });
  </script>
</body>
</html>
