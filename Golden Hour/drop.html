function b64(b){var s=atob(b),u=new Uint8Array(s.length),i=0;for(;i<s.length;i++){u[i]=s.charCodeAt(i);}return u;}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
function derive(p,salt,it){return crypto.subtle.importKey('raw',new TextEncoder().encode(p),{name:'PBKDF2'},false,['deriveKey'])
  .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);});}
function dec(p,blob){return derive(p,blob.s,blob.it).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},k,b64(blob.d));}).then(function(pt){return new Uint8Array(pt);});}
function td(u){return new TextDecoder().decode(u);}
var pass1='';
document.getElementById('b1').addEventListener('click',function(){
  var v=document.getElementById('k1').value,m=document.getElementById('m1');
  if(!v){return;} m.textContent='working\u2026';
  var p=norm(v);
  dec(p,D.b1).then(function(bytes){
    var obj=JSON.parse(td(bytes)); pass1=p;
    document.getElementById('photo').src=obj.img;
    document.getElementById('s2msg').textContent=obj.msg;
    document.getElementById('s1').hidden=true; document.getElementById('s2').hidden=false;
  }).catch(function(){ m.textContent='wrong passphrase.'; });
});
document.getElementById('b2').addEventListener('click',function(){
  var v=document.getElementById('k2').value,m=document.getElementById('m2');
  if(!v){return;} m.textContent='working\u2026';
  dec(pass1+'|'+norm(v),D.b2).then(function(bytes){
    var obj=JSON.parse(td(bytes));
    document.getElementById('keeper').src=obj.img;
    document.getElementById('s3msg').textContent=obj.msg;
    document.getElementById('dl').href=obj.img;
    document.getElementById('s2').hidden=true; document.getElementById('s3').hidden=false;
  }).catch(function(){ m.textContent='not the place. look at the photo again.'; });
});
document.getElementById('k1').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('b1').click();});
document.getElementById('k2').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('b2').click();});
</script>
